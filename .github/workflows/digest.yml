name: Daily digest

on:
  schedule:
    - cron: "30 4 * * *"   # 06:30 SAST every day
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["intel/**", "requirements.txt", ".github/workflows/digest.yml"]

permissions:
  contents: write   # commits data/ that the bot reads

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and send the digest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m intel.build

      - name: Publish data for the bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git commit -m "Digest $(TZ=Africa/Johannesburg date +%Y-%m-%d)" || echo "No change"
          git pull --rebase --autostash
          git push
